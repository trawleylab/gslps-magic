<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stick Flight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b7fff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stick Flight">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ 3D ENGINE CANVAS (full-bleed, behind UI) ============ -->
  <canvas id="scene"></canvas>

  <!-- ============ TOP-LEVEL OVERLAYS ============ -->
  <div id="hit-flash"></div>
  <div id="drag-ghost" hidden><span class="drag-ghost-dot"></span></div>
  <canvas id="confetti"></canvas>

  <!-- ============ TITLE / HOME ============ -->
  <section id="title-screen" class="screen" hidden>
    <button type="button" class="sound-btn" data-action="toggle-sound" aria-label="Toggle sound">🔊</button>
    <h1 class="title"><span class="title-emoji">✈️</span> Stick Flight</h1>
    <p class="tagline">Weave through the city — fly through the finish! 🏁</p>

    <div class="title-stats">
      <div class="stat-pill"><span class="stat-label">Best</span><span id="title-best">0 m</span></div>
      <div class="stat-pill"><span class="stat-label">Tokens</span><span id="title-tokens">🪙 0</span></div>
    </div>

    <div class="title-actions">
      <button type="button" class="big-btn play" data-action="play">▶ Play</button>
      <button type="button" class="big-btn shop" data-action="open-shop">🎨 Customize</button>
    </div>
  </section>

  <!-- ============ GAME HUD (overlay over #scene) ============ -->
  <section id="game-screen" class="screen hud" hidden>
    <header class="hud-top">
      <button type="button" id="quit-btn" class="quit-btn" data-action="quit" aria-label="Quit game">✕</button>
      <div id="progress-bar">
        <div id="progress-fill"></div>
        <div id="progress-plane">✈️</div>
        <div class="progress-flag">🏁</div>
      </div>
      <div id="token-pill" class="pill token-pill">🪙 0</div>
    </header>

    <div id="toast" class="toast">&nbsp;</div>

    <div id="countdown-overlay" hidden>
      <div id="countdown-text">3</div>
    </div>
  </section>

  <!-- ============ SHOP / CUSTOMIZE ============ -->
  <section id="shop-screen" class="screen" hidden>
    <header class="shop-top">
      <button type="button" class="back-btn" data-action="shop-back" aria-label="Back">⬅</button>
      <h1 class="shop-title">🎨 Customize</h1>
      <div id="shop-balance" class="pill token-pill">🪙 0</div>
    </header>

    <!-- #hero-canvas is positioned by CSS into this preview stage when the shop is active -->
    <div class="hero-stage">
      <canvas id="hero-canvas"></canvas>
    </div>

    <div class="shop-scroll">
      <div id="shop-grid"></div>
    </div>
  </section>

  <!-- ============ WIN ============ -->
  <section id="win-screen" class="screen" hidden>
    <div class="results-scroll">
      <div class="results-body">
        <h1 class="result-title win-title">🎉 You made it! 🎉</h1>
        <div id="win-tokens" class="token-breakdown"></div>
        <div id="win-best" class="best-line"></div>
      </div>
      <div class="results-actions">
        <button type="button" class="big-btn play" data-action="play-again">▶ Fly Again</button>
        <button type="button" class="big-btn shop" data-action="open-shop">🎨 Customize</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME OVER / CRASH ============ -->
  <section id="gameover-screen" class="screen" hidden>
    <div class="results-scroll">
      <div class="results-body">
        <h1 class="result-title crash-title">💥 Crash! 💥</h1>
        <div id="crash-tokens" class="token-breakdown"></div>
        <div id="crash-best" class="best-line"></div>
      </div>
      <div class="results-actions">
        <button type="button" class="big-btn play" data-action="play-again">▶ Fly Again</button>
        <button type="button" class="big-btn shop" data-action="open-shop">🎨 Customize</button>
      </div>
    </div>
  </section>

  <!-- Script load order is fixed: three -> flight -> app -->
  <script src="vendor/three.min.js"></script>
  <script src="flight.js"></script>
  <script src="app.js"></script>

  <!-- Service worker registration (offline PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
